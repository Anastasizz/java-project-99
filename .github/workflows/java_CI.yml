name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Check Sentry token presence
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is EMPTY"
          else
            echo "SENTRY_AUTH_TOKEN is PRESENT"
          fi

      - name: Print Gradle task graph
        run: ./gradlew build --dry-run

      - run: make build
      - run: make report

      - name: Build and analyze
        run: ./gradlew sonar --info

      - name: Upload source bundle to Sentry
        if: github.event_name == 'push' && env.SENTRY_AUTH_TOKEN != ''
        run: ./gradlew sentryUploadSourceBundleJava --info